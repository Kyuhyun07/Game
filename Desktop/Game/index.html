<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>점프맵 오비 - BlockWorld</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;}
    canvas{display:block;}

    /* 크로스헤어 */
    #crosshair{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:12px;height:12px;
      border:2px solid rgba(255,255,255,0.9);
      border-radius:50%;pointer-events:none;
    }

    /* 상단 HUD */
    #hud-top{
      position:fixed;top:0;left:0;right:0;
      display:flex;justify-content:space-between;align-items:flex-start;
      padding:14px 20px;pointer-events:none;
    }
    #checkpoint-info{
      color:#fff;text-shadow:1px 1px 4px #000;
    }
    #checkpoint-info h3{font-size:1rem;color:#aaa;font-weight:normal;}
    #checkpoint-info p{font-size:1.5rem;font-weight:bold;color:#ffe066;}
    #timer-box{
      color:#fff;text-align:right;text-shadow:1px 1px 4px #000;
    }
    #timer-box small{color:#aaa;font-size:0.8rem;}
    #timer-box #timer{font-size:2rem;font-weight:bold;color:#ffe066;}

    /* 진행 바 */
    #progress-bar-wrap{
      position:fixed;top:0;left:0;right:0;height:4px;
      background:rgba(255,255,255,0.15);
    }
    #progress-bar{
      height:100%;width:0%;
      background:linear-gradient(90deg,#e74c3c,#f1c40f,#2ecc71);
      transition:width 0.4s;
    }

    /* 알림 */
    #notify{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      color:#fff;font-size:2rem;font-weight:bold;
      text-shadow:2px 2px 8px #000;
      opacity:0;transition:opacity 0.4s;
      pointer-events:none;text-align:center;
    }

    /* 조작 힌트 */
    #hint{
      position:fixed;bottom:18px;left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,0.5);font-size:0.75rem;
      text-align:center;pointer-events:none;
    }

    /* 시작화면 */
    #start-screen{
      position:fixed;inset:0;z-index:200;
      background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:#fff;
    }
    #start-screen h1{
      font-size:3.5rem;font-weight:900;margin-bottom:6px;
      background:linear-gradient(90deg,#f7971e,#ffd200);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    #start-screen .sub{color:#888;margin-bottom:36px;font-size:1rem;}
    .btn{
      padding:13px 46px;font-size:1.1rem;font-weight:bold;
      border:none;border-radius:50px;cursor:pointer;
      margin:6px;transition:transform .12s,box-shadow .12s;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
    }
    .btn:hover{transform:scale(1.06);}
    .btn-primary{background:linear-gradient(90deg,#f7971e,#ffd200);color:#1a1a1a;}
    .btn-red{background:linear-gradient(90deg,#e74c3c,#c0392b);color:#fff;}
    .btn-green{background:linear-gradient(90deg,#27ae60,#2ecc71);color:#fff;}
    .btn-blue{background:linear-gradient(90deg,#2980b9,#3498db);color:#fff;}
    .controls{
      margin-top:28px;color:#555;font-size:0.8rem;
      line-height:2.2;text-align:center;
    }

    /* 일시정지 */
    #pause-screen{
      position:fixed;inset:0;z-index:150;
      background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);
      display:none;flex-direction:column;
      align-items:center;justify-content:center;color:#fff;
      gap:12px;
    }
    #pause-screen h2{font-size:2.5rem;margin-bottom:10px;}

    /* 클리어 */
    #clear-screen{
      position:fixed;inset:0;z-index:160;
      background:rgba(0,0,0,0.85);
      display:none;flex-direction:column;
      align-items:center;justify-content:center;color:#fff;
    }
    #clear-screen h2{font-size:3.5rem;color:#ffd200;margin-bottom:8px;}
    #clear-screen .stats{
      color:#aaa;margin-bottom:30px;font-size:1rem;
      text-align:center;line-height:2;
    }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>🏃 점프맵 오비</h1>
  <div class="sub">로블록스 스타일 장애물 코스 게임</div>
  <button class="btn btn-primary" id="play-btn">▶ 게임 시작</button>
  <div class="controls">
    WASD / 방향키 이동 &nbsp;|&nbsp; Space 점프 &nbsp;|&nbsp; 마우스 카메라 회전<br>
    더블 스페이스 더블점프 &nbsp;|&nbsp; ESC 일시정지
  </div>
</div>

<div id="pause-screen">
  <h2>⏸ 일시정지</h2>
  <button class="btn btn-green" id="resume-btn">▶ 계속하기</button>
  <button class="btn btn-red" id="restart-btn">🔄 처음부터</button>
</div>

<div id="clear-screen">
  <h2>🏆 완주!</h2>
  <div class="stats" id="clear-stats"></div>
  <button class="btn btn-primary" id="replay-btn">🔄 다시 하기</button>
</div>

<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<div id="crosshair"></div>

<div id="hud-top">
  <div id="checkpoint-info">
    <h3>체크포인트</h3>
    <p id="cp-text">0 / 0</p>
  </div>
  <div id="timer-box">
    <small>⏱ 시간</small>
    <div id="timer">0.0s</div>
  </div>
</div>

<div id="notify"></div>
<div id="hint">WASD 이동 &nbsp;|&nbsp; Space 점프 &nbsp;|&nbsp; 더블Space 더블점프 &nbsp;|&nbsp; ESC 일시정지</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
